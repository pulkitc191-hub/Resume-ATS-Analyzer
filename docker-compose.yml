version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: resume_mysql
    restart: always
    environment:
      MYSQL_DATABASE: resume_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_analyser_app
    ports:
      - "8080:8080"
    environment:
      - url=jdbc:mysql://db:3306/resume_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - uname=root
      - upass=rootpassword
      - genkey=${GENKEY}
      - mailkey=${MAILKEY}
      - gcpid=${GCPID}
      - gcpsecret=${GCPSECRET}
      - adzunaid=${ADZUNAID}
      - adzunakey=${ADZUNAKEY}
      - jwtkey=${JWTKEY:-my_default_secure_jwt_secret_key_123456}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
